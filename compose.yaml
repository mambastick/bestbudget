name: bestbudget

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bestbudget}
      POSTGRES_USER: ${POSTGRES_USER:-bestbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/mambastick/bestbudget:${BESTBUDGET_VERSION:-1.0.0-beta.1}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bestbudget}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bestbudget}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    stop_grace_period: 20s

  backup:
    image: ghcr.io/mambastick/bestbudget:${BESTBUDGET_VERSION:-1.0.0-beta.1}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["./docker-entrypoint.sh", "backup"]
    command: ["schedule"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bestbudget}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bestbudget}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_LAST: ${BACKUP_KEEP_LAST:-7}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ${BACKUP_PATH:-./backups}:/app/backups
    healthcheck:
      test: ["CMD", "node", "dist-scripts/backup.mjs", "status", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 60s

volumes:
  pgdata:
