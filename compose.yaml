name: bestbudget

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bestbudget}
      POSTGRES_USER: ${POSTGRES_USER:-bestbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: bestbudget:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bestbudget}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bestbudget}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
