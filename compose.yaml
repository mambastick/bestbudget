name: bestbudget

# Uses the published image by default: `docker compose up -d`.
# To build from source instead: `docker compose up -d --build`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bestbudget}
      POSTGRES_USER: ${POSTGRES_USER:-bestbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/mambastick/bestbudget:${BESTBUDGET_VERSION:-1.0.0-beta.1}
    build: .
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${BESTBUDGET_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bestbudget}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bestbudget}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    stop_grace_period: 20s

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/backup.sh"]
    command: ["schedule"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-bestbudget}
      PGUSER: ${POSTGRES_USER:-bestbudget}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BESTBUDGET_VERSION: ${BESTBUDGET_VERSION:-1.0.0-beta.1}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_LAST: ${BACKUP_KEEP_LAST:-7}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: UTC
    volumes:
      - ${BACKUP_PATH:-./.data/backups}:/backups
      - ./deploy/helm/bestbudget/files/backup:/scripts:ro
    tmpfs:
      - /run/bestbudget
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/bestbudget/root && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Optional: COMPOSE_PROFILES=backup-s3. Local backup scheduling never depends on S3.
  backup-s3:
    image: amazon/aws-cli:2.31.4
    profiles: ["backup-s3"]
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/upload.sh"]
    command: ["watch"]
    environment:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-bestbudget}
      AWS_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      HOME: /var/tmp
    volumes:
      - ${BACKUP_PATH:-./.data/backups}:/backups
      - ./deploy/helm/bestbudget/files/backup:/scripts:ro
    read_only: true
    tmpfs:
      - /var/tmp

volumes:
  pgdata:
