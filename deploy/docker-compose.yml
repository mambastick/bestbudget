services:
  postgres:
    image: postgres:16-alpine
    container_name: bestbudget-postgres
    environment:
      POSTGRES_DB: bestbudget
      POSTGRES_USER: bestbudget
      POSTGRES_PASSWORD: bestbudget
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestbudget -d bestbudget"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bestbudget-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bestbudget
      MINIO_ROOT_PASSWORD: bestbudget-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: bestbudget-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
