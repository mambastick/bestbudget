{{- if .Values.backup.enabled }}
{{- $name := include "bestbudget.backup.fullname" . }}
{{- if not .Values.backup.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "bestbudget.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes:
    {{- toYaml .Values.backup.persistence.accessModes | nindent 4 }}
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "bestbudget.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "bestbudget.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              args: ["backup", "now"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "bestbudget.secretName" . }}
                      key: DATABASE_URL
                - name: BACKUP_KEEP_LAST
                  value: {{ .Values.backup.retention.keepLast | quote }}
                - name: BACKUP_KEEP_DAYS
                  value: {{ .Values.backup.retention.keepDays | quote }}
                - name: TZ
                  value: {{ .Values.backup.timeZone | quote }}
                - name: TMPDIR
                  value: /work
                {{- if .Values.backup.s3.enabled }}
                - name: BACKUP_S3_BUCKET
                  value: {{ required "backup.s3.bucket is required when S3 is enabled" .Values.backup.s3.bucket | quote }}
                - name: BACKUP_S3_PREFIX
                  value: {{ .Values.backup.s3.prefix | quote }}
                - name: BACKUP_S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: BACKUP_S3_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                {{- range $key := list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "AWS_SESSION_TOKEN" }}
                - name: {{ $key }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "backup.s3.existingSecret is required when S3 is enabled" $.Values.backup.s3.existingSecret }}
                      key: {{ $key }}
                      {{- if eq $key "AWS_SESSION_TOKEN" }}
                      optional: true
                      {{- end }}
                {{- end }}
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /app/backups
                - name: tmp
                  mountPath: /work
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "bestbudget.backup.claim" . }}
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
