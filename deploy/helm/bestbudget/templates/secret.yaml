{{- if not .Values.existingSecret }}
{{- $name := include "bestbudget.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bestbudget.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ include "bestbudget.secretValue" (list . $name "BETTER_AUTH_SECRET" .Values.auth.secret 48) | quote }}
  SETUP_TOKEN: {{ include "bestbudget.secretValue" (list . $name "SETUP_TOKEN" .Values.auth.setupToken 32) | quote }}
  DATABASE_URL: {{ include "bestbudget.databaseUrl" . | quote }}
  {{- with .Values.auth.encryptionKey }}
  ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.smtp.url }}
  SMTP_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.notifications.telegram.botToken }}
  TELEGRAM_BOT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.notifications.telegram.webhookSecret }}
  TELEGRAM_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.notifications.vapid.privateKey }}
  VAPID_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
