# Default values for BestBudget.

image:
  repository: ghcr.io/mambastick/bestbudget
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# REQUIRED. Public URL users open in the browser, e.g. https://budget.example.com.
# Used for cookies, CSRF origin checks, invitation links and the SSO callback.
appUrl: ""

auth:
  # Session secret (BETTER_AUTH_SECRET). Generated on install and kept across upgrades when empty.
  secret: ""
  # Key for secrets stored in the database (OIDC client secret). Optional; derived from `secret` when empty.
  encryptionKey: ""
  # One-time token for creating the first administrator at /setup. Generated when empty — see NOTES.
  setupToken: ""
  # Emergency access: force e-mail/password login on.
  forceLocalLogin: false
  # Trust X-Forwarded-For from the ingress controller (client IPs for rate limiting and sessions).
  trustProxy: true

# Use an existing Secret instead of the generated one. Expected keys:
# BETTER_AUTH_SECRET, SETUP_TOKEN, DATABASE_URL, and optionally ENCRYPTION_KEY, OIDC_CLIENT_SECRET, SMTP_URL,
# TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, VAPID_PRIVATE_KEY.
# When set, auth.*, oidc.clientSecret, smtp.url and the database URL are taken from it.
existingSecret: ""

# SSO via OpenID Connect. Values here take priority over the admin UI.
# Leave issuer empty to configure SSO in the admin UI instead.
oidc:
  issuer: ""
  clientId: ""
  clientSecret: ""
  scopes: "openid profile email"
  displayName: "SSO"
  # Default: <appUrl>/api/auth/callback/oidc
  redirectUri: ""
  enabled: true
  # Create accounts on first SSO login (otherwise an invitation is required).
  allowSignup: false

# Optional e-mail for self-service password reset.
smtp:
  url: ""
  from: ""

# Exchange rates: cbr (Bank of Russia + DB cache) or none (manual rates only).
fxProvider: cbr

# Payment reminders. Empty transport credentials use encrypted database settings.
notifications:
  jobsEnabled: true
  telegram:
    botToken: ""
    # Empty keeps the admin UI's mode (polling by default).
    mode: ""
    webhookSecret: ""
  vapid:
    publicKey: ""
    privateKey: ""
    subject: ""

# Extra environment variables for the app container.
extraEnv: []

# Bundled single-instance PostgreSQL. Disable to use an external database.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  database: bestbudget
  username: bestbudget
  # Generated on install and kept across upgrades when empty.
  password: ""
  persistence:
    size: 5Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

externalDatabase:
  # postgres://user:password@host:5432/dbname — used when postgresql.enabled=false.
  url: ""

# Scheduled PostgreSQL custom-format dumps. Requires Kubernetes >= 1.27 (CronJob timeZone).
backup:
  enabled: true
  schedule: "0 3 * * *"
  timeZone: Europe/Moscow
  suspend: false
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 3600
  retention:
    # Keep the union of the newest N dumps and all dumps younger than N days.
    keepLast: 7
    keepDays: 30
  persistence:
    size: 5Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  s3:
    enabled: false
    bucket: ""
    prefix: bestbudget
    endpoint: ""
    region: us-east-1
    # Keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, optional AWS_SESSION_TOKEN.
    existingSecret: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to the host of appUrl.
  host: ""
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
