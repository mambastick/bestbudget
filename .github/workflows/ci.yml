name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bestbudget_test_oidc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oidc-test-password
        ports: ["54341:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm i18n:check
      - name: Test fixed clock scenarios
        run: |
          for instant in 2026-10-23T09:00:00Z 2026-11-01T09:00:00Z 2026-12-31T20:30:00Z; do
            TEST_NOW="$instant" pnpm test
          done
      - name: Test OIDC lock-out protection on PostgreSQL 17 with concurrent connections
        env:
          TEST_POSTGRES_URL: postgres://postgres:oidc-test-password@127.0.0.1:54341/bestbudget_test_oidc
        run: pnpm exec vitest run tests/integration/oidc-roles.test.ts
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Docker Compose smoke test (build, persistence, backup and restore)
        run: ./scripts/compose-smoke.sh

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - name: Validate shell scripts
        run: |
          sh -n docker-entrypoint.sh scripts/check-helm.sh
          bash -n scripts/compose-smoke.sh
          shellcheck docker-entrypoint.sh scripts/check-helm.sh scripts/compose-smoke.sh
      - name: Lint and render Helm deployment variants
        run: ./scripts/check-helm.sh
