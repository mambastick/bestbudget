name: Candidate image

on:
  pull_request:
    paths:
      - src/**
      - scripts/**
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/candidate.yml

permissions:
  contents: read

jobs:
  image:
    # Fork pull requests cannot publish packages with this repository's token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=candidate-amd64
          cache-to: type=gha,mode=max,scope=candidate-amd64
